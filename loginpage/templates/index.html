<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Driver-Drowsiness-Detection-Login</title>
 <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand">
        
        <h1>Driver-Drowsiness-Detection</h1>
        <p>Real-Time Drowsiness Detection for Road Safety.</p>
      </div>

      <!-- Tab Switcher -->
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Login</button>
        <button class="tab" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>
        <div id="loginError" class="error-msg hidden"></div>
        <button type="submit" class="btn-primary">Login</button>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" class="form hidden">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="signupUsername" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="••••••••" required />
        </div>
        <div id="signupError" class="error-msg hidden"></div>
        <button type="submit" class="btn-primary">Create Account</button>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
